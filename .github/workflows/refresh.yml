name: Daily refresh

on:
  schedule:
    - cron: "30 23 * * *"   # 06:30 Vietnam time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -e .
      - name: Restore raw data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Fetch (incremental) + train + forecast
        run: |
          python -m airwatch.cli fetch --refresh
          python -m airwatch.cli train
          python -m airwatch.cli forecast
      - name: Commit forecast
        run: |
          git config user.name "airwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast
          git diff --cached --quiet || git commit -m "Daily forecast $(date -u +%F)"
          git push
